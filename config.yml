instance: home-deco

api:
  host: http://192.168.68.1
  username: admin
  password_file: /run/secrets/deco_password
  verify_ssl: true
  timeout_seconds: 10
  timeout_retries: 3

metrics:
  collection_interval: 60

probes:
  enabled: true
  interval: 30
  attempts: 1
  timeout: 2

logs:
  enabled: false
  poll_interval: 60
  level: INFO
  timezone_fallback: UTC
  page_size: 100
  state_path: /data/log-watermark.json

loki:
  url: http://loki:3100/loki/api/v1/push
  verify_ssl: true
  timeout_seconds: 10
  batch_size: 500
  retries: 3

server:
  host: 0.0.0.0
  port: 9100

logging:
  level: INFO
