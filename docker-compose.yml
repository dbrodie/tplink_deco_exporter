services:
  tplink-deco-exporter:
    image: ghcr.io/dbrodie/tplink_deco_exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - deco-state:/data
      - ./config.yml:/config/config.yml:ro
    secrets:
      - deco_password
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9100/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

secrets:
  deco_password:
    file: ./.secrets/deco_password

volumes:
  deco-state:
